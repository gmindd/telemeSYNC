# Publishes the landing page (site/) on GitHub Pages and refreshes the Buy Me a Coffee supporters.
# Setup once: Settings → Pages → Source: "GitHub Actions"; Settings → Secrets → Actions → BMC_TOKEN.
# Scheduled runs only happen on the repository's default branch.
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/fetch-supporters.mjs', '.github/workflows/site.yml']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Latest supporters
        env:
          BMC_TOKEN: ${{ secrets.BMC_TOKEN }}
        run: node scripts/fetch-supporters.mjs site/data/supporters.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
