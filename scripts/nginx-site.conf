# nginx config for the landing page image (Dockerfile). Listens on 80 and on 3000, Coolify's
# default port, so the proxy reaches it whichever port is set in the application.
server {
    listen 80;
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pages, styles, scripts and translations: browsers check for a newer version on every visit
    location ~* \.(html|css|js|json)$ {
        add_header Cache-Control "no-cache";
    }

    # Latest release: read by the site and by the program (which runs on localhost, hence CORS)
    location = /data/latest.json {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # Refreshed every 6 hours inside the container: never serve an old copy from cache
    location = /data/supporters.json {
        add_header Cache-Control "no-cache";
    }
}
