# nginx config for the landing page image (Dockerfile). Listens on 80 and on 3000, Coolify's
# default port, so the proxy reaches it whichever port is set in the application.

# Statistics (/stats): pages, script.js (only real browsers fetch it) and the program's update check
# are also written to a small log that scripts/visits.mjs reads every hour and then empties.
map $uri $stats_log {
    default             0;
    /index.html         1;
    /stats.html         1;
    /legal.html         1;
    /script.js          1;
    /data/latest.json   1;
}
log_format stats escape=json '$time_iso8601\t$remote_addr\t$request_method\t$status\t$uri\t$http_referer\t$http_user_agent\t$http_origin\t$http_sec_purpose$http_purpose';

server {
    listen 80;
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # The visitor's address as sent by Coolify's proxy (requests reach this container from Docker's
    # private network); used for the visit statistics only, see scripts/visits.mjs
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/access.log main;
    access_log /var/lib/telemesync/access.log stats if=$stats_log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pages, styles, scripts and translations: browsers check for a newer version on every visit
    location ~* \.(html|css|js|json)$ {
        add_header Cache-Control "no-cache";
    }

    # Latest release: read by the site and by the program (which runs on localhost, hence CORS)
    location = /data/latest.json {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # Statistics page for sponsors: /stats (and /stats/) serve stats.html
    location = /stats { try_files /stats.html =404; add_header Cache-Control "no-cache"; }
    location = /stats/ { absolute_redirect off; return 301 /stats; }

    # Updated every hour by the stats collector
    location = /data/stats.json {
        add_header Cache-Control "no-cache";
    }

    # Updated by the webhook receiver: never serve an old copy from cache
    location = /data/supporters.json {
        add_header Cache-Control "no-cache";
    }

    # Buy Me a Coffee webhook (scripts/bmc-webhook.mjs checks the signature)
    location = /api/bmc-webhook {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        client_max_body_size 64k;
    }
}
