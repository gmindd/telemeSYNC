# nginx config for the landing page image (Dockerfile). Listens on 80 and on 3000, Coolify's
# default port, so the proxy reaches it whichever port is set in the application.
server {
    listen 80;
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pages, styles, scripts and translations: browsers check for a newer version on every visit
    location ~* \.(html|css|js|json)$ {
        add_header Cache-Control "no-cache";
    }

    # Latest release: read by the site and by the program (which runs on localhost, hence CORS)
    location = /data/latest.json {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # Statistics page for sponsors: /stats (and /stats/) serve stats.html
    location = /stats { try_files /stats.html =404; add_header Cache-Control "no-cache"; }
    location = /stats/ { absolute_redirect off; return 301 /stats; }

    # Updated every hour by the stats collector
    location = /data/stats.json {
        add_header Cache-Control "no-cache";
    }

    # Updated by the webhook receiver: never serve an old copy from cache
    location = /data/supporters.json {
        add_header Cache-Control "no-cache";
    }

    # Buy Me a Coffee webhook (scripts/bmc-webhook.mjs checks the signature)
    location = /api/bmc-webhook {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        client_max_body_size 64k;
    }
}
