      <stop offset="0" stop-color="#1b2a44"/>
      <stop offset="0.55" stop-color="#6a4a5e"/>
      <stop offset="0.85" stop-color="#d9824a"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
